<!DOCTYPE html>
<html lang="en">
<head>
  {% block title %}<title>Local Library</title>{% endblock %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
  <!-- Add additional CSS in static file -->
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="site-body">
  <div class="container-fluid px-lg-4">
    <div class="row site-row">
      <div class="col-sm-3 col-md-2 sidebar-col">
      {% block sidebar %}
        <nav class="sidebar-nav-wrap" aria-label="Main">
          <p class="sidebar-brand text-uppercase small">Local Library</p>
          <ul class="sidebar-nav">
            <li><a href="{% url 'index' %}">Home</a></li>
            <li><a href="{% url 'books' %}">All books</a></li>
            <li><a href="{% url 'authors' %}">All authors</a></li>
          </ul>
        </nav>
      {% endblock %}
      </div>
      <div class="col-sm-9 col-md-10 main-col">
        <main class="main-content py-4">{% block content %}{% endblock %}</main>
      </div>
    </div>
  </div>
</body>
</html>
